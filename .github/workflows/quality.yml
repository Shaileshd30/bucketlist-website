name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: "true"
      SUPABASE_URL: "https://example.supabase.co"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
      SUPABASE_SECRET_KEY: "ci-placeholder-secret-key"
      SUPABASE_TRIP_IMAGES_BUCKET: "trip-images"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-placeholder-password"
      ADMIN_SESSION_SECRET: "ci-placeholder-session-secret-at-least-32-characters"
      RAZORPAY_KEY_ID: "rzp_test_ci_placeholder"
      RAZORPAY_KEY_SECRET: "ci-placeholder-razorpay-secret"
      RAZORPAY_WEBHOOK_SECRET: "ci-placeholder-webhook-secret"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run ESLint
        run: npm run lint -- --max-warnings=12

      - name: Build application
        run: npm run build