<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Skyscanner flight search | Bucketlist Adventure</title>
  <style>body{margin:0;background:#fff;font:14px/1.5 Arial,sans-serif;color:#17251d}main{min-width:250px;padding:4px}a{color:#17251d}p{font-size:12px;color:#64716a}</style>
</head>
<body>
  <main>
    <div data-skyscanner-widget="SearchWidget"
      data-locale="en-GB"
      data-market="IN"
      data-currency="INR"
      data-flight-type="return"
      data-target="_blank"
      data-colour="#ffffff"
      data-font-colour="#17251d"
      data-button-colour="#17251d"
      data-button-font-colour="#ffffff"
      data-button-label="Search flights"
      data-powered-by-logo-colour="dark"></div>
    <p>If the search form does not appear, <a href="https://www.skyscanner.co.in/" target="_blank" rel="noopener noreferrer">search directly on Skyscanner ↗</a>.</p>
    <noscript>Enable JavaScript to use the embedded search form.</noscript>
  </main>
  <script src="https://widgets.skyscanner.net/widget-server/js/loader.js" async></script>
</body>
</html>
